spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/dbsyncer_metadata
    username: dbsyncer
    password: dbsyncer_pass
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    clean-disabled: false

server:
  port: 8080

logging:
  level:
    com.dbsyncer: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
