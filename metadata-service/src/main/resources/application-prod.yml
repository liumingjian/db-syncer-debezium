spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      leak-detection-threshold: 30000

  jpa:
    show-sql: false

  flyway:
    clean-disabled: true

server:
  port: 8080

logging:
  level:
    com.dbsyncer: INFO
    org.springframework: WARN
    org.hibernate: WARN
