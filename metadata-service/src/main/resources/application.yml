spring:
  application:
    name: db-syncer-metadata-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dbsyncer_metadata}
    username: ${DB_USERNAME:dbsyncer}
    password: ${DB_PASSWORD:dbsyncer_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: metadata-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.dbsyncer: INFO
    org.springframework: INFO
    org.hibernate: INFO

connect:
  rest-url: ${CONNECT_REST_URL:http://localhost:8083}
  wait-timeout-ms: ${CONNECT_WAIT_TIMEOUT_MS:60000}
  poll-interval-ms: ${CONNECT_POLL_INTERVAL_MS:2000}
  metadata-service-url: ${METADATA_SERVICE_URL:http://metadata-service:8080}
  schema-history-dir: ${CONNECT_SCHEMA_HISTORY_DIR:/kafka/connect/custom-connectors/schema-history}
  enable-progress-smt: ${CONNECT_ENABLE_PROGRESS_SMT:false}
