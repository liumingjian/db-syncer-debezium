spring:
  datasource:
    url: jdbc:tc:postgresql:12:///testdb
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 5

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

logging:
  level:
    com.dbsyncer: DEBUG
    org.testcontainers: WARN
